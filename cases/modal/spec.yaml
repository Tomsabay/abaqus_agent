meta:
  abaqus_release: "2021"
  model_name: "ModalBeam"
  units: "mm_MPa_t"
  description: "First six modes of a 20x10x200 steel box, encastre at z=0."

material:
  name: Steel
  E: 210000.0
  nu: 0.3
  density: 7.85e-9

parts:
  - name: Beam
    features:
      - op: sketch
        id: profile
        plane: XY
        profile:
          rect:
            corner1: [0.0, 0.0]
            corner2: [20.0, 10.0]   # W x H, so the weak axis is H
      - op: extrude
        sketch: profile
        depth: 200.0
    section: {type: solid, material: Steel}
    mesh: {seed: 10.0, element: C3D20R}
    expect:
      volume: 40000.0
      cells: 1

assembly:
  instances:
    - {name: Beam-1, part: Beam, translate: [0.0, 0.0, 0.0]}
  expect:
    instances: 1

steps:
  # The step IS the Abaqus method, so the mode count is that method's own
  # keyword rather than a field this dialect invents a name for.
  - call: FrequencyStep
    name: {literal: Step-1}
    previous: {literal: Initial}
    numEigen: 6

conditions:
  - call: EncastreBC
    name: {literal: Fixed}
    createStepName: {literal: Initial}
    region: {set: "Beam-1:face@z=min", name: FIXED_END, expect: "=1"}

outputs:
  kpis:
    - name: freq_1
      type: eigenfrequency
      location: mode_1
    - name: freq_2
      type: eigenfrequency
      location: mode_2
    - name: freq_3
      type: eigenfrequency
      location: mode_3
  field_variables: [U]
