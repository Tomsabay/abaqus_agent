meta:
  abaqus_release: "2021"
  model_name: "CantileverPlastic"
  units: "mm_MPa_t"
  description: "Elastic-perfectly-plastic cantilever driven ~8.5x past its
    plastic limit load. It is meant NOT to converge."

material:
  name: Steel
  E: 210000.0
  nu: 0.3
  yield: 235.0
  hardening: 0.0   # perfectly plastic on purpose: nothing arrests the collapse

parts:
  - name: Beam
    features:
      - op: sketch
        id: profile
        plane: XY
        profile:
          rect:
            corner1: [0.0, 0.0]
            corner2: [10.0, 10.0]
      - op: extrude
        sketch: profile
        depth: 100.0
    section: {type: solid, material: Steel}
    mesh: {seed: 5.0, element: C3D20R}
    expect:
      volume: 10000.0
      cells: 1

assembly:
  instances:
    - {name: Beam-1, part: Beam, translate: [0.0, 0.0, 0.0]}
  expect:
    instances: 1

steps:
  - call: StaticStep
    name: {literal: Step-1}
    previous: {literal: Initial}

conditions:
  - call: EncastreBC
    name: {literal: Fixed}
    createStepName: {literal: Initial}
    region: {set: "Beam-1:face@z=min", name: FIXED_END, expect: "=1"}
  - call: ConcentratedForce
    name: {literal: Tip}
    createStepName: {literal: Step-1}
    region: {set: "Beam-1:node@box=4.9,4.9,99.9,5.1,5.1,100.1", name: TIP_NODES,
             expect: "=1"}
    cf2: -5000.0
    expect: {points: 1}

outputs:
  kpis:
    - name: U_tip
      type: nodal_displacement
      location: TIP_NODES
      component: U2
    - name: MISES_MAX
      type: field_max
      location: whole_model
      invariant: MISES
  field_variables: [S, E, U, RF, PEEQ]
