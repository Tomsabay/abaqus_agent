meta:
  abaqus_release: "2021"
  model_name: "SteelFrameBlast"
  units: "mm_MPa_t"
  description: "3-story Q345 steel moment frame (3x6m bays x 2x6m bays, 3.6m stories, HW400x400 columns / HN500x200 beams, 120mm C30 slabs) under 200kg TNT air blast at 12m front standoff. Kingery-Bulmash reflected overpressure, per-column-line Friedlander histories with traveling-wave arrival delay. INP generated by generate_inp.py."

geometry:
  type: custom_inp
  inp_path: SteelFrameBlast.inp

material:
  name: Steel_Q345
  E: 210000.0
  nu: 0.3
  density: 7.85e-9
  yield: 345.0
  hardening: 2000.0

analysis:
  solver: explicit
  step_type: Dynamic_Explicit
  time_period: 0.2
  cpus: 2
  mp_mode: threads

bc_load:
  fixed_face: "column_bases"
  load_type: blast_conwep
  blast_tnt_kg: 200.0
  blast_standoff_mm: 12000.0

outputs:
  kpis:
    - name: U2_ROOF_PEAK
      type: history_output_max
      variable: U2
    - name: PEEQ_MAX
      type: field_max
      field_variable: PEEQ
      location: whole_model
    - name: ALLPD_MAX
      type: history_output_max
      variable: ALLPD
