meta:
  abaqus_release: "2021"
  model_name: "SteelFrameBlast"
  units: "mm_MPa_t"
  description: "3-story Q345 steel moment frame (3x6m by 2x6m bays, 3.6m
    stories, HW400x400 columns, HN500x200 beams, 120mm C30 slabs) under 200 kg
    TNT at 12 m front standoff, with per-column-line Friedlander histories and a
    traveling-wave arrival delay. The deck is written by generate_inp.py in this
    directory and run as it stands."

# Everything about the model is in the file: its parts, its steps, its blast
# amplitudes, its boundary conditions. v1 spelled this
# `geometry: {type: custom_inp, inp_path: ...}` and then had to carry `analysis`
# and `bc_load` beside it, because the v1 branch required them -- two blocks
# describing a model that the deck had already decided, read by nothing.
deck:
  file: SteelFrameBlast.inp

material:
  name: Steel_Q345
  E: 210000.0
  nu: 0.3
  density: 7.85e-9
  yield: 345.0
  hardening: 2000.0

outputs:
  kpis:
    - name: U2_ROOF_PEAK
      type: history_output_max
      variable: U2
    - name: PEEQ_MAX
      type: field_max
      field_variable: PEEQ
      location: whole_model
    - name: ALLPD_MAX
      type: history_output_max
      variable: ALLPD
