[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abaqus-agent"
version = "0.2.0.dev0"
description = "Local simulation QA and regression framework for Abaqus FEA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Abaqus Agent Contributors" }]
keywords = ["abaqus", "fea", "simulation", "qa", "regression-testing", "devops", "mcp", "odb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
llm = ["anthropic>=0.36", "openai>=1.0"]
pdf = ["playwright>=1.45"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1", "httpx>=0.24", "mcp>=1.0"]
all = ["abaqus-agent[mcp,llm,pdf,dev]"]

[project.scripts]
abaqus-agent = "cli:main"
abaqus-agent-case-memory = "scripts.inspect_case_memory:main"
abaqus-agent-doctor-patterns = "scripts.inspect_solver_doctor_patterns:main"
abaqus-agent-copilot-install-plugin = "scripts.install_copilot_plugin:main"
abaqus-agent-kpi-recipes = "scripts.inspect_kpi_recipes:main"
abaqus-agent-local-cli-smoke = "scripts.run_local_cli_smoke:main"
abaqus-agent-copilot-alpha-release-gate = "scripts.verify_copilot_alpha_release:main"
abaqus-agent-copilot-alpha-package = "scripts.package_copilot_alpha:main"
abaqus-agent-copilot-real-smoke = "scripts.run_copilot_real_smoke:main"
abaqus-agent-copilot-verify-alpha-package = "scripts.verify_copilot_alpha_package:main"
abaqus-agent-vault = "scripts.inspect_evidence_vault:main"
abaqus-agent-verify-local-demo-pack = "scripts.verify_local_demo_pack_bundle:main"
abaqus-agent-verify-local-cli-smoke = "scripts.verify_local_cli_smoke_bundle:main"

[project.urls]
Homepage = "https://github.com/Tomsabay/abaqus_agent"
Documentation = "https://github.com/Tomsabay/abaqus_agent#readme"
Repository = "https://github.com/Tomsabay/abaqus_agent"
Issues = "https://github.com/Tomsabay/abaqus_agent/issues"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["artifacts", "evidence/real_abaqus_smoke_*"]

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "case_memory",
    "capsule",
    "cli.py",
    "contracts",
    "copilot",
    "core",
    "doctor",
    "odb_lens",
    "runner",
    "post",
    "simdiff",
    "tools",
    "premium",
    "reporting",
    "validation",
    "evidence",
    "scripts",
    "server.py",
    "mcp_bridge.py",
    "mcp_server.py",
    "run_benchmark.py",
]

[tool.hatch.build.targets.wheel.force-include]
"copilot/codex_app_server_client.mjs" = "copilot/codex_app_server_client.mjs"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
