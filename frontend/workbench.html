  for (const entry of ((run.orchestrator_result || {}).visuals || [])) {
    if (typeof entry === 'string') out.push({ file: entry.split(/[\\/]/).pop() });
    else if (entry && typeof entry === 'object') {
      const raw = entry.file || entry.path || entry.png || '';
      if (raw) out.push({ file: String(raw).split(/[\\/]/).pop(), label: entry.label || entry.name });
    }
  }
  return out;
}

async function renderCompare(runId) {
  const runs = state.session.runs || [];
  const idx = runs.findIndex(r => r.run_id === runId);
  const prev = runs.slice(0, idx).reverse().find(r => r.status === 'COMPLETED');
  if (!prev) return;
  const diff = await api(`/api/run/${prev.run_id}/diff/${runId}`);
  const entries = ((diff.sections || {}).kpis || {}).kpis || [];
  if (!entries.length) return;
  let rows = '';
  for (const e of entries) {
    const rel = (typeof e.rel_delta === 'number') ? (e.rel_delta * 100).toFixed(1) + '%' : '—';
    rows += `<tr><td>${esc(e.name)}</td><td>${fmtNum(e.before)}</td><td>${fmtNum(e.after)}</td>
      <td>${rel}</td><td><span class="chip ${esc(e.status)}">${esc(e.status)}</span></td></tr>`;
  }
  $('cmp-slot').innerHTML = `
    <div class="sec-label">${esc(t('cmp.label', {
      before: prev.run_id.slice(0, 8), after: runId.slice(0, 8) }))}</div>
    <table class="cmp"><thead><tr><th>KPI</th><th>${esc(t('cmp.before'))}</th><th>${esc(t('cmp.after'))}</th><th>Δ%</th><th>${esc(t('cmp.verdict'))}</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

/* ── Tabs & wiring ─────────────────────────────────────────────── */
function switchTab(view) {
  document.querySelectorAll('.tab').forEach(tab =>
    tab.classList.toggle('active', tab.dataset.view === view));
  document.querySelectorAll('.workview').forEach(v =>
    v.classList.toggle('active', v.id === 'view-' + view));
  if (view === 'diff') document.querySelector('.tab[data-view="diff"]').classList.remove('has-badge');
  if (view === 'results') document.querySelector('.tab[data-view="results"]').classList.remove('has-badge');
  // A language switch cannot cheaply re-render a results pane the user is not
  // looking at (showRun refetches and would yank the tab under them), so the
  // stale pane is repainted the moment it comes back into view.
  if (view === 'results' && state.resultsStale && state.activeRun) {
    state.resultsStale = false;
    showRun(state.activeRun).catch(() => {});
  }
}

document.querySelectorAll('.tab').forEach(tab =>
  tab.addEventListener('click', () => switchTab(tab.dataset.view)));

/* ── Language ──────────────────────────────────────────────────────
 * data-i18n covers the static chrome; everything below was written into
 * the DOM by JS and has to be rebuilt by hand. Panels the user is not
 * looking at are marked stale instead of re-fetched.
 */
$('btn-lang').addEventListener('click', () => I18N.toggle());

I18N.onChange((lang) => {
  // Refusal wording lives in the backend catalogue, which arrives over the
  // network, so the re-render below has to wait for it — otherwise the banner
  // repaints with the old language's entries still registered.
  loadBackendMessages(lang).then(() => {
    if (state.activeRun && $('view-results')?.classList.contains('active')) {
      showRun(state.activeRun).catch(() => {});
    }
  });
  sbRefreshText();
  sbSyncRun();
  if (state.lastStages) renderStageChips(state.lastStages);
  if (state.session) {
    renderChat();
    renderRuns();
    if (state.session.pending) renderDiffNote(state.session.pending);
  }
  if (state.sliderFields && state.sliderBaseYaml) {
    renderSliderPanel(state.sliderBaseYaml, state.sliderFields);
  }
  repaintVpStats();
  refreshSessions().catch(() => {});
  if (state.activeRun) {
    const onResults = $('view-results')?.classList.contains('active');
    if (onResults) showRun(state.activeRun).catch(() => {});
    else state.resultsStale = true;
  }
});

document.querySelectorAll('.quick').forEach(q =>

updatePickModeBtn();
$('btn-accept').addEventListener('click', acceptProposal);
$('btn-reject').addEventListener('click', rejectProposal);
$('btn-new-session').addEventListener('click', async () => {
  const created = await api('/api/workbench/sessions', { method: 'POST', body: JSON.stringify({}) });
  await refreshSessions();
  await loadSession(created.session_id);
});
$('session-select').addEventListener('change', (e) => loadSession(e.target.value));
$('console-head').addEventListener('click', () => $('console').classList.toggle('collapsed'));

initStatusBar();
loadBackendMessages(I18N.lang);
boot();
</script>
</body>
</html>
